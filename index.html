<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Außenangreifer Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: eine Spalte, Tagesleiste oben, vier Reiter unten (Training, Schmerzen, Progress, Dehnen). Schmerzen ist rot, Progress grün, Dehnen orange. Gym-tauglich: große Tippflächen, Zahlen groß. */
:root {
  --bg: #E9EEF3;
  --surface: #FFFFFF;
  --surface2: #F2F5F9;
  --ink: #122033;
  --muted: #566679;
  --line: #D2DAE3;
  --accent: #1B5FC2;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE8FA;
  --ok: #1E7A46;
  --ok-ink: #FFFFFF;
  --ok-soft: #D9F0E2;
  --warn: #7F5400;
  --warn-soft: #FBEBC4;
  --bad: #B3261E;
  --bad-soft: #FADAD7;
  /* Dehnen: orange */
  --s-bg: #F6B06A; --s-surface: #FFF6EA; --s-surface2: #FDE6CC; --s-ink: #2A1708; --s-muted: #4A3320; --s-line: #E3B98A;
  --s-accent: #B34A00; --s-accent-ink: #FFFFFF; --s-accent-soft: #FFD9AE;
  /* Progress: grün */
  --p-bg: #9FD4B0; --p-surface: #F2FBF5; --p-surface2: #DDF1E4; --p-ink: #0F2418; --p-muted: #20402C; --p-line: #A9CDB6;
  --p-accent: #17653A; --p-accent-ink: #FFFFFF; --p-accent-soft: #C4E8D0;
  /* Schmerzen: rot */
  --r-bg: #F2A9A4; --r-surface: #FFF4F3; --r-surface2: #FBDCD9; --r-ink: #2A0A08; --r-muted: #4D2420; --r-line: #E2AEA9;
  --r-accent: #A81F18; --r-accent-ink: #FFFFFF; --r-accent-soft: #F9CBC7; --r-bad: #B3261E; --r-bad-soft: #FADAD7;
  /* Knie: Petrol */
  --k-bg: #A5D3D8; --k-surface: #F1FAFB; --k-surface2: #D9EFF1; --k-ink: #0A2427; --k-muted: #1D4448; --k-line: #A3CBD0;
  --k-accent: #0B6670; --k-accent-ink: #FFFFFF; --k-accent-soft: #BDE5E9;
  --font-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1520; --surface: #142130; --surface2: #1B2B3D; --ink: #E7EDF4; --muted: #94A4B9; --line: #27394D;
    --accent: #6AA5F5; --accent-ink: #0C1520; --accent-soft: #1D3556;
    --ok: #5CCB8A; --ok-ink: #0C1520; --ok-soft: #173A2B; --warn: #F0C25A; --warn-soft: #3F3314; --bad: #FF8A80; --bad-soft: #4A1F1C;
    --s-bg: #3B2108; --s-surface: #4A2B0E; --s-surface2: #593515; --s-ink: #FBEBD9; --s-muted: #E0B88E; --s-line: #7A4A1E;
    --s-accent: #FFA94D; --s-accent-ink: #2A1500; --s-accent-soft: #6B3F12;
    --p-bg: #0E3321; --p-surface: #164430; --p-surface2: #1D5539; --p-ink: #E6F7EC; --p-muted: #A5D4B7; --p-line: #2E7050;
    --p-accent: #6FDB9B; --p-accent-ink: #06241A; --p-accent-soft: #1F5C3D;
    --r-bg: #3A100D; --r-surface: #4B1814; --r-surface2: #5C211C; --r-ink: #FCE8E6; --r-muted: #E8B3AE; --r-line: #7D332D;
    --r-accent: #FF8F85; --r-accent-ink: #2A0603; --r-accent-soft: #6E2A24; --r-bad: #FFB4AB; --r-bad-soft: #74291F;
    --k-bg: #0B2A2E; --k-surface: #123A40; --k-surface2: #194A51; --k-ink: #E3F6F8; --k-muted: #9FD0D5; --k-line: #276068;
    --k-accent: #6FD6E0; --k-accent-ink: #05262A; --k-accent-soft: #1B5961;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1520; --surface: #142130; --surface2: #1B2B3D; --ink: #E7EDF4; --muted: #94A4B9; --line: #27394D;
  --accent: #6AA5F5; --accent-ink: #0C1520; --accent-soft: #1D3556;
  --ok: #5CCB8A; --ok-ink: #0C1520; --ok-soft: #173A2B; --warn: #F0C25A; --warn-soft: #3F3314; --bad: #FF8A80; --bad-soft: #4A1F1C;
  --s-bg: #3B2108; --s-surface: #4A2B0E; --s-surface2: #593515; --s-ink: #FBEBD9; --s-muted: #E0B88E; --s-line: #7A4A1E;
  --s-accent: #FFA94D; --s-accent-ink: #2A1500; --s-accent-soft: #6B3F12;
  --p-bg: #0E3321; --p-surface: #164430; --p-surface2: #1D5539; --p-ink: #E6F7EC; --p-muted: #A5D4B7; --p-line: #2E7050;
  --p-accent: #6FDB9B; --p-accent-ink: #06241A; --p-accent-soft: #1F5C3D;
  --r-bg: #3A100D; --r-surface: #4B1814; --r-surface2: #5C211C; --r-ink: #FCE8E6; --r-muted: #E8B3AE; --r-line: #7D332D;
  --r-accent: #FF8F85; --r-accent-ink: #2A0603; --r-accent-soft: #6E2A24; --r-bad: #FFB4AB; --r-bad-soft: #74291F;
    --k-bg: #0B2A2E; --k-surface: #123A40; --k-surface2: #194A51; --k-ink: #E3F6F8; --k-muted: #9FD0D5; --k-line: #276068;
    --k-accent: #6FD6E0; --k-accent-ink: #05262A; --k-accent-soft: #1B5961;
  color-scheme: dark;
}
/* Tab-Farben: der aktive Reiter setzt die Grundtokens neu */
body[data-tab="pain"] { --bg: var(--r-bg); --surface: var(--r-surface); --surface2: var(--r-surface2); --ink: var(--r-ink); --muted: var(--r-muted); --line: var(--r-line); --accent: var(--r-accent); --accent-ink: var(--r-accent-ink); --accent-soft: var(--r-accent-soft); --bad: var(--r-bad); --bad-soft: var(--r-bad-soft); }
body[data-tab="knee"] { --bg: var(--k-bg); --surface: var(--k-surface); --surface2: var(--k-surface2); --ink: var(--k-ink); --muted: var(--k-muted); --line: var(--k-line); --accent: var(--k-accent); --accent-ink: var(--k-accent-ink); --accent-soft: var(--k-accent-soft); }
body[data-tab="stretch"] { --bg: var(--s-bg); --surface: var(--s-surface); --surface2: var(--s-surface2); --ink: var(--s-ink); --muted: var(--s-muted); --line: var(--s-line); --accent: var(--s-accent); --accent-ink: var(--s-accent-ink); --accent-soft: var(--s-accent-soft); }
body[data-tab="progress"] { --bg: var(--p-bg); --surface: var(--p-surface); --surface2: var(--p-surface2); --ink: var(--p-ink); --muted: var(--p-muted); --line: var(--p-line); --accent: var(--p-accent); --accent-ink: var(--p-accent-ink); --accent-soft: var(--p-accent-soft); }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--font-body);
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 8px 130px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 640px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding-block: 10px 12px; }
.kicker { font: 600 12px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 32px/1 var(--font-display); text-transform: uppercase; letter-spacing: .02em; margin: 2px 0 0; }
.stepper { display: flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.stepper button { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 9px; font: 700 24px var(--font-display); }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper .wk { min-width: 96px; text-align: center; font: 700 22px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.phase { margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; line-height: 1.4; }
.phase b { font: 700 15px var(--font-display); letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.cloudstat { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-align: right; }
.storewarn { margin: 0 0 8px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 500; }

.days { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding-block: 8px; }
.day-btn { position: relative; min-height: 52px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font: 700 19px var(--font-display); text-transform: uppercase; letter-spacing: .03em; padding: 0; }
.day-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.day-btn.today::after { content: ''; position: absolute; left: 50%; bottom: 6px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--accent); }
.day-btn.today[aria-pressed="true"]::after { background: var(--accent-ink); }

.dayhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-block: 10px 6px; }
.dayhead .dh { flex: 1; min-width: 0; }
.dayhead .btn { flex: none; }
.dayhead h2 { font: 700 30px/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .02em; margin: 0; text-wrap: balance; }
.dayhead p { margin: 6px 0 0; color: var(--muted); font-size: 15px; max-width: 60ch; }
.dayhead p.when { color: var(--ink); font: 600 13px var(--font-body); letter-spacing: .06em; text-transform: uppercase; }
.progrow { display: flex; align-items: center; gap: 12px; margin: 10px 0 14px; }
.prog { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
.progtxt { font: 600 14px var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.list { display: grid; gap: 10px; }
.ex { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.ex.done { background: var(--surface2); }
.chk { grid-row: 1; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; color: transparent; }
.chk svg { width: 22px; height: 22px; }
.ex.done .chk { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.exmain { min-width: 0; }
.exname { font: 600 17px/1.25 var(--font-body); margin: 0; overflow-wrap: anywhere; }
.ex.done .exname { color: var(--muted); }
.exmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 4px; }
.sets { font: 700 19px/1 var(--font-display); color: var(--accent); letter-spacing: .02em; }
.chip { font: 600 12px/1.6 var(--font-body); letter-spacing: .04em; padding: 0 8px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); }
.chip.knee { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.hint { margin: 4px 0 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.wtrow { grid-column: 2; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }
.wtrow label { font: 600 13px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.wt { width: 88px; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); color: var(--ink); text-align: center; font: 700 24px var(--font-display); padding: 0 8px; font-variant-numeric: tabular-nums; }
.last { font-size: 13px; color: var(--muted); }
.variant { grid-column: 2; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }
.variant label { font: 600 13px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.variant select { flex: 1; min-width: 0; min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface2); color: var(--ink); padding: 0 8px; font: 400 15px var(--font-body); }
.exedit { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.exform { grid-column: 1 / -1; display: grid; gap: 10px; }
.exform .lbl { display: block; font: 600 13px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.exform .chkrow { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 16px; }
.exform .chkrow input { width: 22px; height: 22px; accent-color: var(--accent); }
.exform .acts { display: flex; gap: 8px; flex-wrap: wrap; }

.vb { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--accent-soft); margin-bottom: 10px; }
.vb b { font: 700 18px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.vb p { margin: 2px 0 0; font-size: 14px; }
.rest { padding: 20px 16px; border: 1px dashed var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 10px; }
.rest p { margin: 0; }
.addcard { margin-top: 12px; }
.removed { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.removed span { min-width: 0; overflow-wrap: anywhere; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(20px, env(safe-area-inset-right, 0px)) calc(26px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.navbtn { min-height: 52px; min-width: 0; border: 0; background: transparent; border-radius: 10px; color: var(--muted); font: 700 12px var(--font-display); text-transform: uppercase; letter-spacing: 0; padding: 0; overflow: hidden; }
.navbtn[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.navbtn .dot { display: none; width: 8px; height: 8px; border-radius: 50%; margin-left: 5px; vertical-align: middle; }
.navbtn .dot.ok { display: inline-block; background: var(--ok); }
.navbtn .dot.warn { display: inline-block; background: var(--warn); }
.navbtn .dot.bad { display: inline-block; background: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.card h3 { font: 700 22px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 10px; }
.card p { margin: 0 0 8px; }
.card p:last-child { margin-bottom: 0; }
.fold { padding: 0 14px; }
.fold summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; cursor: pointer; font: 700 22px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary::after { content: '+'; font-size: 26px; color: var(--accent); }
.fold[open] summary::after { content: '\2212'; }
.fold .foldbody { padding-block: 0 14px; }
.sub { font: 700 18px var(--font-display); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 8px; }
.banner { padding: 14px; border-radius: 12px; margin-bottom: 12px; font-weight: 500; }
.banner b { display: block; font: 700 22px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 4px; }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.none { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }

.field { margin-bottom: 14px; }
.field > label, .field > .lbl { display: block; font: 600 13px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.sb { min-height: 46px; border: 1px solid transparent; border-radius: 10px; font: 700 22px var(--font-display); }
.sb[data-z="ok"] { background: var(--ok-soft); color: var(--ok); }
.sb[data-z="warn"] { background: var(--warn-soft); color: var(--warn); }
.sb[data-z="bad"] { background: var(--bad-soft); color: var(--bad); }
.sb[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink); }
.legend { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg.s3 { grid-template-columns: repeat(3, 1fr); margin-bottom: 12px; }
.seg.s4 { grid-template-columns: repeat(4, 1fr); margin-bottom: 12px; }
.seg.s4 button { font-size: 15px; white-space: nowrap; padding: 0 2px; }
.ampel { display: grid; gap: 8px; margin: 0 0 10px; }
.ampel > div { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: start; }
.ampel i { width: 14px; height: 14px; border-radius: 50%; margin-top: 3px; }
.ampel .g i { background: var(--ok); } .ampel .y i { background: #E0A100; } .ampel .r i { background: var(--bad); }
.ampel p { margin: 0; font-size: 15px; }
.kwarn { border-left: 4px solid var(--bad); }
.seg button { min-height: 46px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font: 700 20px var(--font-display); text-transform: uppercase; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg.inner button { background: var(--surface2); }
.seg.inner button[aria-pressed="true"] { background: var(--accent); }
.in, select.in, textarea.in { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface2); color: var(--ink); font: 400 16px var(--font-body); padding: 10px 12px; }
textarea.in { min-height: 76px; resize: vertical; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.row2 > div { min-width: 0; }
.in, select.in { min-width: 0; max-width: 100%; }
input[type="date"].in { display: block; -webkit-appearance: none; appearance: none; min-width: 0; text-align: left; line-height: 1.2; }
input[type="date"].in::-webkit-date-and-time-value { text-align: left; min-width: 0; }
select.in { text-overflow: ellipsis; }
@media (max-width: 330px) { .row2 { grid-template-columns: minmax(0, 1fr); } }
.btn { min-height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 700 20px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { min-height: 40px; font-size: 16px; padding: 0 12px; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.msg { margin: 8px 0 0; min-height: 20px; font-size: 14px; color: var(--muted); }

.trend { position: relative; height: 80px; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 4px; }
.trend .bar { flex: 1; min-width: 0; min-height: 3px; border-radius: 4px 4px 0 0; }
.trend .bar[data-z="ok"] { background: var(--ok); }
.trend .bar[data-z="warn"] { background: var(--warn); }
.trend .bar[data-z="bad"] { background: var(--bad); }
.trend .thr { position: absolute; left: 0; right: 0; bottom: 30%; border-top: 1px dashed var(--muted); pointer-events: none; }

.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
.entry .eh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.entry .ed { font: 700 20px var(--font-display); text-transform: uppercase; letter-spacing: .03em; }
.entry .eu { color: var(--muted); font-size: 14px; }
.entry .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pill { font: 700 14px/1.7 var(--font-body); padding: 0 10px; border-radius: 99px; }
.pill[data-z="ok"] { background: var(--ok-soft); color: var(--ok); }
.pill[data-z="warn"] { background: var(--warn-soft); color: var(--warn); }
.pill[data-z="bad"] { background: var(--bad-soft); color: var(--bad); }
.pill[data-z="n"] { background: var(--surface2); color: var(--muted); }

.stat .v small { font-size: 14px; color: var(--muted); margin-left: 2px; }
.chart { display: block; width: 100%; height: auto; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font: 500 11px var(--font-body); }
.chart .ar { fill: var(--accent-soft); opacity: .7; }

.chart .dl { fill: var(--accent); stroke: var(--accent); stroke-width: 2; }

ul.rules { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

.small { font-size: 14px; color: var(--muted); }
/* Tabwechsel: Farben gleiten weich, die Ansicht schiebt zur Seite */
body { overflow-x: hidden; }
body, body * { transition: background-color .45s ease, border-color .45s ease, color .45s ease, fill .45s ease, stroke .45s ease; }
.prog i { transition: width .2s; }
#app { position: relative; overflow-x: clip; }
.view.enter-fwd { animation: vin-fwd .45s cubic-bezier(.22, .8, .3, 1) both; }
.view.enter-back { animation: vin-back .45s cubic-bezier(.22, .8, .3, 1) both; }
.view.leave { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
.view.leave.to-left { animation: vout-left .45s cubic-bezier(.22, .8, .3, 1) both; }
.view.leave.to-right { animation: vout-right .45s cubic-bezier(.22, .8, .3, 1) both; }
@keyframes vin-fwd { from { transform: translate3d(70%, 0, 0); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes vin-back { from { transform: translate3d(-70%, 0, 0); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes vout-left { from { transform: none; opacity: 1; } to { transform: translate3d(-70%, 0, 0); opacity: 0; } }
@keyframes vout-right { from { transform: none; opacity: 1; } to { transform: translate3d(70%, 0, 0); opacity: 0; } }
.banner.bad { border: 1px solid var(--bad); }
@media (prefers-reduced-motion: reduce) {
  body, body * { transition: none; }
  .view.enter-fwd, .view.enter-back, .view.leave.to-left, .view.leave.to-right { animation: none; }
}

.picbox { display: none; grid-column: 1 / -1; margin-top: 6px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px 8px; --fig: #C5C9D0; --hot: #D62839; --warm: #F1A5AD; }

.fig text { font: 600 9px var(--font-display); letter-spacing: .14em; fill: var(--muted); }
.sil * { fill: var(--fig); }
.sil line { stroke: var(--fig); stroke-linecap: round; fill: none; }

.mh * { fill: var(--hot); stroke: var(--surface2); stroke-width: .5; }

.mleg span { display: inline-flex; align-items: center; gap: 6px; }
.mdot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.mdot.h { background: var(--hot); } .mdot.s { background: var(--warm); }
.mtags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
.mtag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.2; padding: 3px 9px 3px 7px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); }
.mnote { margin: 8px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
.ex.done .picbox { opacity: .7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .picbox { --fig: #454B55; --hot: #FF4D5E; --warm: #8D3D48; } }
:root[data-theme="dark"] .picbox { --fig: #454B55; --hot: #FF4D5E; --warm: #8D3D48; }

    return {
      get: function () {
        var find = cfg.gistId ? Promise.resolve(cfg.gistId) : ghFetch(cfg, '/gists?per_page=100').then(function (list) {
          var g = list.filter(function (x) { return x.description === GHDESC && x.files && x.files[GHFILE]; })[0];
          if (g) { cfg.gistId = g.id; ghSave(cfg); }
          return g ? g.id : null;
        });
        return find.then(function (id) {
          if (!id) return { exists: false };
          return ghFetch(cfg, '/gists/' + id).then(function (g) {
            var f = g.files && g.files[GHFILE];
            if (!f) return { exists: false };
            if (f.truncated) return fetch(f.raw_url).then(function (r) { return r.text(); }).then(function (t) { return { exists: true, data: function () { return parse(t); } }; });
            return { exists: true, data: function () { return parse(f.content); } };
          });
        });
      },
      set: function (d) {
        var files = {}; files[GHFILE] = { content: JSON.stringify(d) };
        if (cfg.gistId) return ghFetch(cfg, '/gists/' + cfg.gistId, { method: 'PATCH', body: { files: files } });
        return ghFetch(cfg, '/gists', { method: 'POST', body: { description: GHDESC, public: false, files: files } }).then(function (g) { cfg.gistId = g.id; ghSave(cfg); });
      }
    };
  }
  function ghStart() {
    var cfg = ghCfg(); if (!cfg) return Promise.resolve(false);
    return cloudSync(ghAdapter(cfg), 'GitHub').then(function () { return true; }, function (e) {
      cloudDoc = null; cloudReady = false;
      cloudMsg(e && (e.status === 401 || e.status === 403) ? 'GitHub-Token ungültig oder ohne Gist-Recht' : 'GitHub nicht erreichbar, lokal gespeichert');
      return false;
    });
  }
  function initCloud() {
    try {
      if (window.claude && claude.use) {
        Promise.all([claude.use('user'), claude.use('db')]).then(function (r) {
          var user = r[0], db = r[1];
          if (!user || !db || !user.id) { ghStart(); return; }
          return Promise.resolve(user.id()).then(function (id) {
            return cloudSync(db.collection('data/users/' + id).doc('app'), 'Konto');
          });
        }).catch(function () { ghStart(); });
        return;
      }
      ghStart();
    } catch (e) { /* ignorieren */ }
  }
  initCloud();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && autoWeek()) { saveAuto(); render(); }
  });
})();
</script>
